name: Build Apache httpd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  HTTPD_VERSION: "2.4.69"
  APR_VERSION: "1.7.6"
  APR_UTIL_VERSION: "1.6.5"
  PCRE2_VERSION: "10.48"
  OPENSSL_VERSION: "3.5.9"
  ZLIB_VERSION: "1.3.1"
  EXPAT_VERSION: "2.9.0"
  NGHTTP2_VERSION: "1.70.0"
  HTTPD_PORT: "8080"
  HTTPD_SSL_PORT: "443"
  MACOS_DEPLOYMENT_TARGET: "12.0"

jobs:
  build-unix:
    name: httpd ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-15
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libtool perl curl pkg-config

      - name: Build and verify
        run: |
          chmod +x scripts/build-unix.sh
          ./scripts/build-unix.sh "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: httpd-${{ env.HTTPD_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            httpd-${{ env.HTTPD_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            httpd-${{ env.HTTPD_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256

  build-windows:
    name: httpd windows x86_64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and verify
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: httpd-${{ env.HTTPD_VERSION }}-windows-x86_64
          if-no-files-found: error
          path: |
            httpd-${{ env.HTTPD_VERSION }}-windows-x86_64.zip
            httpd-${{ env.HTTPD_VERSION }}-windows-x86_64.zip.sha256

  release:
    name: Publish release
    needs:
      - build-unix
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            httpd-*/httpd-*.tar.gz
            httpd-*/httpd-*.tar.gz.sha256
            httpd-*/httpd-*.zip
            httpd-*/httpd-*.zip.sha256
          generate_release_notes: true
